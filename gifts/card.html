<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подарок</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="card-page">
  <div class="stars" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="page card-main">
    <p id="card-status" class="lead">Открываем подарок…</p>
    <article class="gift-sheet" id="gift-sheet" hidden>
      <div class="gift-tile-frame" id="card-frame"></div>
      <h1 id="card-title"></h1>
      <p id="card-price"></p>
      <a class="primary" id="card-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Открыть товар</a>
      <div class="actions card-actions">
        <button class="ghost" id="card-delete" type="button" hidden>Удалить</button>
        <button class="ghost" id="card-close" type="button">Закрыть</button>
      </div>
    </article>
  </main>
  <script type="module" src="js/card.js"></script>
</body>
</html>
